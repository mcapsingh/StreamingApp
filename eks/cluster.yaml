# eksctl create cluster -f eks/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: streamingapp-cluster
  region: ap-south-1
  version: "1.31"

managedNodeGroups:
  - name: streamingapp-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 30

addons:
  - name: aws-ebs-csi-driver        # needed for the MongoDB PersistentVolumeClaim
    wellKnownPolicies:
      ebsCSIController: true
  - name: amazon-cloudwatch-observability   # CloudWatch Container Insights: metrics + logs

iam:
  withOIDC: true
